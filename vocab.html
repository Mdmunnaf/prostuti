function apply(){const dk=S.theme=='dark'||(S.theme=='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);const r=document.documentElement;r.dataset.theme=dk?'dark':'light';r.style.setProperty('--fs',(SZ[S.size]||17)+'px');meta.content=dk?'#1c1d1f':'#f3efe8'}
try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',apply)}catch(e){}
let V=null,busy=false,nav=false;
const ids=k=>{const a=[];if(k=='wrong'){for(let i=0;i<N;i++)if(S.st[i]==2)a.push(i)}else if(k=='saved'){for(let i=0;i<N;i++)if(S.sv[i])a.push(i)}else{const n=+k;if(n>=1&&n<=SETS)for(let i=(n-1)*PER;i<Math.min(n*PER,N);i++)a.push(i)}return a};
const cnt=()=>{let k=0,w=0,s=0;for(let i=0;i<N;i++){if(S.st[i]==1)k++;else if(S.st[i]==2)w++;if(S.sv[i])s++}return{k,w,s}};
function home(){
 const c=cnt(),m=c.k+c.w,p=Math.round(m/N*100);
 let sets='';for(let n=1;n<=SETS;n++){const a=ids(n),mk=a.filter(i=>S.st[i]).length,w=a.filter(i=>S.st[i]==2).length;
  sets+=`<button class="sc" data-a="deck" data-k="${n}"><b>সেট ${bn(n)}</b><span class="mm">প্রশ্ন ${bn(a[0]+1)}–${bn(a[a.length-1]+1)}</span><div class="bar"><i style="width:${mk/a.length*100}%"></i></div><div class="ft"><span>${mk?bn(mk)+' / '+bn(a.length):'শুরু হয়নি'}</span>${w?`<u>✗ ${bn(w)}</u>`:''}</div></button>`}
 app.innerHTML=`<div class="home"><div class="hd"><div><h1>Word Smart 1<br>Vocabulary Preparation</h1><p class="sub">${bn(N)}টি প্রশ্ন · ${bn(SETS)}টি সেট</p></div><button class="ib" data-a="gear" aria-label="সেটিংস">⚙</button></div>
 <div class="pc"><div class="pct">${bn(p)}%<small>${bn(m)} / ${bn(N)} অনুশীলিত</small></div><div class="bar"><i style="width:${p}%"></i></div><div class="chips"><span class="chip c1">✓ জানি ${bn(c.k)}</span><span class="chip c2">✗ ভুল ${bn(c.w)}</span><span class="chip c3">★ সংরক্ষিত ${bn(c.s)}</span></div></div>
 <h2>দ্রুত অনুশীলন</h2><div class="g2">
 <button class="sc q1 r${c.w?'':' off'}" data-a="${c.w?'deck':'none'}" data-k="wrong"><b>✗ ভুলের খাতা</b><span class="mm">${c.w?bn(c.w)+'টি প্রশ্ন':'এখনো কোনো ভুল নেই'}</span></button>
 <button class="sc q1 s${c.s?'':' off'}" data-a="${c.s?'deck':'none'}" data-k="saved"><b>★ সংরক্ষিত</b><span class="mm">${c.s?bn(c.s)+'টি প্রশ্ন':'কোনো ★ দেওয়া নেই'}</span></button></div>
 <h2>সেটসমূহ</h2><div class="g2">${sets}</div><p class="rs"><a data-a="reset">সব অগ্রগতি রিসেট</a></p></div>`}
function open(k){const a=ids(k);V={key:k,all:a,order:a.slice(),pos:0,tab:'card',flip:false,sum:false,open:new Set(),title:k=='wrong'?'ভুলের খাতা':k=='saved'?'সংরক্ষিত':'সেট '+bn(k)};deck()}
function route(){const h=location.hash;if(h.startsWith('#/d/')){const k=h.slice(4);if(ids(k).length)return open(k)}V=null;home()}
addEventListener('hashchange',route);
function deck(){app.innerHTML=`<div class="top"><button class="ib" data-a="back" aria-label="ফিরে যান">‹</button><div class="tt">${V.title}</div><button class="ib" data-a="gear" aria-label="সেটিংস">⚙</button></div>
 <div class="sb"><div class="tabs"><button data-a="tab" data-v="card" class="${V.tab=='card'?'on':''}">কার্ড</button><button data-a="tab" data-v="list" class="${V.tab=='list'?'on':''}">তালিকা</button></div><div class="bar"><i id="pb"></i></div><span id="pt"></span></div><div class="body" id="body"></div>`;body()}
function prog(){const base=V.all,d=base.filter(i=>V.key=='wrong'?S.st[i]==1:S.st[i]).length;const pb=$('#pb');if(pb){pb.style.width=d/base.length*100+'%';$('#pt').textContent=bn(d)+'/'+bn(base.length)}}
const badge=s=>s==1?'<span class="bd sk">✓ জানি</span>':s==2?'<span class="bd sw">✗ ভুল</span>':'';
function cardHTML(){const i=V.order[V.pos],d=D[i],mt=`<div class="meta"><span>প্রশ্ন ${bn(i+1)}</span>${badge(S.st[i])}</div>`;
 return `<div class="flip${V.flip?' on':''}"><div class="face"><div>${mt}</div><p class="q">${fmt(i)}</p><p class="hint">ট্যাপ করে উত্তর দেখুন</p></div><div class="face b">${mt}<div class="w">${esc(d[1])}</div><p class="m">${esc(d[2])}</p><p class="q2">${fmt(i)}</p></div></div><button class="star" data-a="star" aria-label="সংরক্ষণ">${S.sv[i]?'★':'☆'}</button>`}
function fill(){const w=$('#cw');if(w)w.innerHTML=cardHTML();const c=$('#cnt');if(c)c.textContent=bn(V.pos+1)+' / '+bn(V.order.length);prog()}
function body(){const b=$('#body');
 if(V.sum)return summary(b);
 if(V.tab=='list')return list(b);
 b.innerHTML=`<div class="stage"><div id="cw" class="cw"></div></div><div class="ctl"><button class="cb" data-a="prev" aria-label="আগের">‹</button><span id="cnt"></span><button class="cb" data-a="next" aria-label="পরের">›</button><button class="cb" data-a="shuf">⇄ মেশান</button></div><div class="acts"><button class="ab r" data-a="again">↺ আবার পড়ব</button><button class="ab g" data-a="know">✓ জানি</button></div>`;fill();swipe()}
function list(b,keep){const y=keep?($('.list')||{}).scrollTop:0;
 b.innerHTML='<div class="list">'+V.all.map(i=>{const o=V.open.has(i),s=S.st[i];return `<div class="li"><div class="lh" data-a="li" data-i="${i}"><span class="no">${bn(i+1)}</span><span class="lq">${fmt(i)}</span><span class="dt ${s==1?'sk':'sw'}">${s==1?'✓':s==2?'✗':''}</span></div>${o?`<div class="lb"><div class="w">${esc(D[i][1])}</div><p class="m">${esc(D[i][2])}</p><div class="lbt"><button data-a="lm" data-v="2" data-i="${i}">↺ আবার</button><button data-a="lm" data-v="1" data-i="${i}">✓ জানি</button><button class="star" data-a="ls" data-i="${i}">${S.sv[i]?'★':'☆'}</button></div></div>`:''}</div>`}).join('')+'</div>';
 if(y)$('.list').scrollTop=y;prog()}
function summary(b){const a=V.all,k=a.filter(i=>S.st[i]==1).length,w=a.filter(i=>S.st[i]==2).length,u=a.length-k-w;
 b.innerHTML=`<div class="sm"><h2>${V.title} — সারাংশ</h2><div class="chips"><span class="chip c1">✓ জানি ${bn(k)}</span><span class="chip c2">✗ ভুল ${bn(w)}</span><span class="chip c3">বাকি ${bn(u)}</span></div>
 <button class="sc" data-a="redo"${w?'':' disabled'}>↺ ভুলগুলো আবার পড়ুন (${bn(w)})</button><button class="sc" data-a="rest"${u?'':' disabled'}>বাকিগুলো করুন (${bn(u)})</button><button class="sc" data-a="again0">⟲ আবার শুরু</button><button class="sc" data-a="home">⌂ হোমে ফিরুন</button></div>`;prog()}
function startSub(o){V.order=o;V.pos=0;V.flip=false;V.sum=false;V.tab='card';deck()}
function go(d){const t=V.pos+d,w=$('#cw');if(busy||!w)return;if(t<0||t>=V.order.length)return snap();busy=true;
 w.style.transition='transform .22s ease,opacity .22s';w.style.transform=`translateX(${-d*110}%) rotate(${-d*8}deg)`;w.style.opacity=0;
 setTimeout(()=>{V.pos=t;V.flip=false;fill();w.style.transition='none';w.style.transform=`translateX(${d*60}%)`;void w.offsetWidth;w.style.transition='transform .26s ease,opacity .26s';w.style.transform='';w.style.opacity=1;setTimeout(()=>busy=false,260)},220)}
function snap(){const w=$('#cw');if(!w)return;w.style.transition='transform .2s ease';w.style.transform=''}
function mark(v){if(busy||!V||V.sum||V.tab!='card')return;const i=V.order[V.pos];S.st[i]=v;save();if(V.pos<V.order.length-1)go(1);else{V.sum=true;body()}}
function swipe(){const w=$('#cw');let x0,y0,dx=0,lock=null,dn=false,skip=false,cap=false;
 const st=(x,y,el)=>{if(busy)return;skip=!!el.closest('.star');dn=true;x0=x;y0=y;dx=0;lock=null;w.style.transition='none'};
 const mv=(x,y,ev)=>{if(!dn||skip)return;const mx=x-x0,my=y-y0;if(!lock&&(Math.abs(mx)>6||Math.abs(my)>6))lock=Math.abs(mx)>Math.abs(my)?'x':'y';
  if(lock=='x'){dx=mx;if(ev.cancelable)ev.preventDefault();w.classList.add('drag');w.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`}};
 const en=(ok,ev)=>{if(!dn)return;dn=false;w.classList.remove('drag');if(skip)return;
  if(lock=='x'&&Math.abs(dx)>60){if(ev&&ev.cancelable)ev.preventDefault();go(dx<0?1:-1)}
  else if(!lock&&ok){if(ev&&ev.cancelable)ev.preventDefault();V.flip=!V.flip;w.querySelector('.flip').classList.toggle('on',V.flip)}else snap()};
 w.addEventListener('touchstart',e=>{const t=e.touches[0];st(t.clientX,t.clientY,e.target)},{passive:true});
 w.addEventListener('touchmove',e=>{const t=e.touches[0];mv(t.clientX,t.clientY,e)},{passive:false});
 w.addEventListener('touchend',e=>en(true,e));w.addEventListener('touchcancel',e=>en(false,e));
 w.addEventListener('pointerdown',e=>{if(e.pointerType!='mouse')return;st(e.clientX,e.clientY,e.target);cap=true;try{w.setPointerCapture(e.pointerId)}catch(_){}});
 w.addEventListener('pointermove',e=>{if(e.pointerType=='mouse'&&cap)mv(e.clientX,e.clientY,e)});
 w.addEventListener('pointerup',e=>{if(e.pointerType=='mouse'&&cap){cap=false;en(true,e)}});w.addEventListener('pointercancel',e=>{if(e.pointerType=='mouse'&&cap){cap=false;en(false,e)}})}
function sheet(){let o=$('.ov');if(!o){o=document.createElement('div');o.className='ov';document.body.appendChild(o)}
 const sg=(a,L,cur)=>`<div class="seg">${L.map(([v,l])=>`<button data-a="${a}" data-v="${v}" class="${cur==v?'on':''}">${l}</button>`).join('')}</div>`;
 o.innerHTML=`<div class="sh"><h3>সেটিংস</h3><p>থিম</p>${sg('th',[['auto','অটো'],['light','আলো'],['dark','অন্ধকার']],S.theme)}<p>লেখার আকার</p>${sg('sz',[['s','ছোট'],['m','মাঝারি'],['l','বড়'],['xl','অনেক বড়']],S.size)}<button class="cl" data-a="close">বন্ধ করুন</button></div>`}
document.addEventListener('click',e=>{const ov=e.target.classList.contains('ov');if(ov)return e.target.remove();
 const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,i=+t.dataset.i,v=t.dataset.v;
 switch(a){
 case'gear':sheet();break;case'close':$('.ov')?.remove();break;
 case'th':S.theme=v;save();apply();sheet();break;case'sz':S.size=v;save();apply();sheet();break;
 case'deck':nav=true;location.hash='#/d/'+t.dataset.k;break;
 case'back':nav?(nav=false,history.back()):(location.hash='');break;
 case'home':if(nav){nav=false;history.back()}else location.hash='';break;
 case'reset':if(confirm('সব অগ্রগতি, ভুল ও সংরক্ষিত প্রশ্ন মুছে যাবে। রিসেট করবেন?')){S.st={};S.sv={};save();home()}break;
 case'tab':V.tab=v;V.flip=false;V.sum=false;deck();break;
 case'prev':go(-1);break;
 case'next':if(V.pos>=V.order.length-1){V.sum=true;body()}else go(1);break;
 case'shuf':{if(busy)break;const o=V.order;for(let j=o.length-1;j>0;j--){const r=Math.random()*(j+1)|0;[o[j],o[r]]=[o[r],o[j]]}V.pos=0;V.flip=false;fill();break}
 case'again':mark(2);break;case'know':mark(1);break;
 case'star':{const k=V.order[V.pos];S.sv[k]=!S.sv[k];if(!S.sv[k])delete S.sv[k];save();t.textContent=S.sv[k]?'★':'☆';break}
 case'li':V.open.has(i)?V.open.delete(i):V.open.add(i);list($('#body'),1);break;
 case'lm':S.st[i]=+v;save();list($('#body'),1);break;
 case'ls':S.sv[i]=!S.sv[i];if(!S.sv[i])delete S.sv[i];save();list($('#body'),1);break;
 case'redo':startSub(V.all.filter(j=>S.st[j]==2));break;
 case'rest':startSub(V.all.filter(j=>!S.st[j]));break;
 case'again0':startSub(V.all.slice());break;
 }});
apply();route();
</script>
</body>
</html>
