<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>বাংলাদেশ বিষয় প্রস্তুতি</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--fs:17px;--bg:#f3efe8;--card:#fdfcf8;--ink:#35342f;--mut:#7d7a70;--line:#e8e3d8;--trk:#e6e1d6;--fill:#5b9577;--gn:#3d7a58;--gbg:#e3efe5;--rd:#b24a3c;--rbg:#f6e1dc;--gold:#b98a13;--sbg:#e6edf5;--sh:0 2px 10px rgba(70,60,40,.08)}
:root[data-theme=dark]{--bg:#1c1d1f;--card:#26282b;--ink:#d2d1cb;--mut:#8e8f8a;--line:#34373a;--trk:#35383b;--fill:#5f9a7c;--gn:#8fc4a4;--gbg:#25382d;--rd:#e09a8e;--rbg:#3e2a27;--gold:#d8b256;--sbg:#2a3340;--sh:0 2px 12px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);background:var(--bg);color:var(--ink);font-family:'Hind Siliguri','Noto Sans Bengali',Nikosh,system-ui,sans-serif;line-height:1.65;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
.mainbar{flex:none;display:flex;align-items:center;gap:.4rem;align-self:flex-start;min-height:44px;margin:.4rem 0 0 1.1rem;padding:0 1rem 0 .75rem;border-radius:14px;background:var(--card);box-shadow:var(--sh);color:var(--ink);text-decoration:none;font-size:.95rem;font-weight:500}
.mainbar b{font-size:1.4rem;line-height:1;font-weight:500;color:var(--mut)}
.mainbar:active{transform:scale(.97)}.mainbar:focus-visible{outline:2px solid var(--fill);outline-offset:2px}
body:not(:has(#app .home)) .mainbar{display:none}
.home{flex:1;overflow-y:auto;padding:1rem 1.1rem calc(1.5rem + env(safe-area-inset-bottom))}
.hd{display:flex;justify-content:space-between;gap:.8rem;align-items:flex-start}
h1{margin:.2rem 0 0;font-size:1.4rem;line-height:1.3;font-weight:700}
.sub{margin:.2rem 0 1rem;color:var(--mut);font-size:.95rem}
h2{margin:1.4rem 0 .6rem;font-size:.95rem;color:var(--mut);font-weight:600}
.ib{width:46px;height:46px;border-radius:14px;background:var(--card);box-shadow:var(--sh);font-size:1.4rem;flex:none;display:grid;place-items:center}
.pc{background:var(--card);border-radius:1.4rem;box-shadow:var(--sh);padding:1.2rem 1.2rem 1.1rem}
.pct{font-size:2.6rem;font-weight:700;line-height:1.1}.pct small{font-size:.95rem;font-weight:400;color:var(--mut);margin-left:.5rem}
.bar{height:.7rem;background:var(--trk);border-radius:9px;overflow:hidden;margin:.9rem 0}
.bar i{display:block;height:100%;background:var(--fill);border-radius:9px;transition:width .4s}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{padding:.25rem .8rem;border-radius:99px;font-size:.95rem;font-weight:500}
.c1{background:var(--gbg);color:var(--gn)}.c2{background:var(--rbg);color:var(--rd)}.c3{background:var(--sbg);color:var(--gold)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.sc{background:var(--card);border-radius:1.3rem;box-shadow:var(--sh);padding:1rem 1.1rem;text-align:left;min-height:44px;display:block;width:100%}
.sc b{font-size:1.15rem;display:block}.sc .mm{color:var(--mut);font-size:.9rem}
.sc .bar{height:.55rem;margin:.7rem 0 .5rem}
.sc .ft{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mut)}.ft u{text-decoration:none;color:var(--rd);font-weight:600}
.q1 b{font-size:1.1rem}.q1.r b{color:var(--rd)}.q1.s b{color:var(--gold)}.q1.off{opacity:.55}
.rs{text-align:center;margin:1.8rem 0 0}.rs a{color:var(--mut);font-size:.9rem;text-decoration:underline;padding:.7rem}
.top{display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem .3rem}.tt{flex:1;text-align:center;font-weight:700;font-size:1.15rem}
.sb{display:flex;align-items:center;gap:.8rem;padding:.3rem 1rem}
.tabs{display:flex;background:var(--trk);border-radius:12px;padding:3px;flex:none}
.tabs button{min-height:38px;padding:0 .9rem;border-radius:10px;font-size:.95rem;color:var(--mut)}.tabs .on{background:var(--card);color:var(--ink);box-shadow:var(--sh);font-weight:600}
.sb .bar{flex:1;margin:0;height:.55rem}#pt{font-size:.85rem;color:var(--mut);flex:none}
.body{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;display:flex;align-items:center;padding:.6rem 1rem;overflow:hidden}
.cw{position:relative;width:100%;height:100%;max-height:30rem;perspective:1400px;touch-action:pan-y;-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1)}.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:1.5rem;box-shadow:var(--sh);padding:1.1rem 1.3rem;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;overflow:auto}

.q{margin:auto 0;font-size:1.4rem;line-height:1.75;font-weight:500}
.kw{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.hint{margin:0;text-align:center;color:var(--mut);font-size:.85rem}
.w{font-size:1.2rem;font-weight:700;color:var(--gold);margin-top:auto}
.m{font-size:1.75rem;font-weight:600;line-height:1.5;margin:auto 0}.m.lg{font-size:1.3rem}
.q2{margin:.8rem 0 0;font-size:.95rem;color:var(--mut);line-height:1.65}
.star{position:absolute;top:.4rem;right:.5rem;width:46px;height:46px;border-radius:50%;font-size:1.6rem;color:var(--gold);z-index:2;display:grid;place-items:center}
.ctl{display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.2rem 1rem .5rem}
.cb{min-width:46px;height:46px;border-radius:14px;background:var(--card);box-shadow:var(--sh);padding:0 .8rem;font-size:1.5rem}.cb[data-a=shuf]{font-size:.95rem}
#cnt{min-width:5rem;text-align:center;font-weight:600}
.acts{display:flex;gap:.7rem;padding:.4rem 1rem calc(.8rem + env(safe-area-inset-bottom))}
.ab{flex:1;height:3.7rem;border-radius:1.2rem;font-size:1.1rem;font-weight:600}.ab.r{background:var(--rbg);color:var(--rd)}.ab.g{background:var(--gbg);color:var(--gn)}
.ab:active,.cb:active,.sc:active{transform:scale(.97)}
.list{flex:1;overflow-y:auto;padding:.6rem 1rem calc(1rem + env(safe-area-inset-bottom))}
.li{background:var(--card);border-radius:1.1rem;box-shadow:var(--sh);margin-bottom:.7rem;overflow:hidden}
.lh{display:flex;gap:.7rem;align-items:flex-start;padding:.8rem 1rem;min-height:48px;cursor:pointer}
.no{color:var(--mut);font-size:.85rem;min-width:2.2rem;padding-top:.15rem}.lq{flex:1;line-height:1.65}
.dt{font-weight:700;width:1.2rem;text-align:center}.dt.sk{color:var(--gn)}.dt.sw{color:var(--rd)}
.lb{padding:0 1rem .9rem 3.9rem;animation:fi .25s}.lb .w{margin:0}.lb .m{font-size:1.35rem;margin:.1rem 0 .6rem}
.lbt{display:flex;gap:.5rem}.lbt button{min-height:44px;padding:0 1rem;border-radius:12px;background:var(--trk);font-size:.95rem}.lbt .star{position:static;width:44px;height:44px;font-size:1.4rem}
@keyframes fi{from{opacity:0;transform:translateY(-4px)}}
.sm{flex:1;overflow-y:auto;padding:1.2rem 1.1rem calc(1rem + env(safe-area-inset-bottom));text-align:center}
.sm h2{font-size:1.5rem;color:var(--ink);margin:.5rem 0}
.sm .chips{justify-content:center;margin:.8rem 0 1.4rem}
.sm .sc{text-align:center;margin-bottom:.7rem;font-weight:600;min-height:52px}.sc:disabled{opacity:.45}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;z-index:9;animation:fi .2s}
.sh{width:100%;background:var(--card);border-radius:1.6rem 1.6rem 0 0;padding:1.2rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom))}
.sh h3{margin:0 0 .4rem;font-size:1.2rem}.sh p{margin:.9rem 0 .4rem;color:var(--mut);font-size:.9rem}
.seg{display:flex;background:var(--trk);border-radius:13px;padding:3px}.seg button{flex:1;min-height:44px;border-radius:11px;font-size:.95rem}.seg .on{background:var(--card);box-shadow:var(--sh);font-weight:600}
.cl{display:block;width:100%;margin-top:1.1rem;min-height:48px;border-radius:14px;background:var(--trk);font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

 <button class="sc q1 r${c.w?'':' off'}" data-a="${c.w?'deck':'none'}" data-k="wrong"><b>✗ ভুলের খাতা</b><span class="mm">${c.w?bn(c.w)+'টি প্রশ্ন':'এখনো কোনো ভুল নেই'}</span></button>
 <button class="sc q1 s${c.s?'':' off'}" data-a="${c.s?'deck':'none'}" data-k="saved"><b>★ সংরক্ষিত</b><span class="mm">${c.s?bn(c.s)+'টি প্রশ্ন':'কোনো ★ দেওয়া নেই'}</span></button></div>
 <h2>সেটসমূহ</h2><div class="g2">${sets}</div><p class="rs"><a data-a="reset">সব অগ্রগতি রিসেট</a></p></div>`}
function open(k){const a=ids(k);V={key:k,all:a,order:a.slice(),pos:0,tab:'card',flip:false,sum:false,open:new Set(),title:k=='wrong'?'ভুলের খাতা':k=='saved'?'সংরক্ষিত':'সেট '+bn(k)};deck()}
function route(){const h=location.hash;if(h.startsWith('#/d/')){const k=h.slice(4);if(ids(k).length)return open(k)}V=null;home()}
addEventListener('hashchange',route);
function deck(){app.innerHTML=`<div class="top"><button class="ib" data-a="back" aria-label="ফিরে যান">‹</button><div class="tt">${V.title}</div><button class="ib" data-a="gear" aria-label="সেটিংস">⚙</button></div>
 <div class="sb"><div class="tabs"><button data-a="tab" data-v="card" class="${V.tab=='card'?'on':''}">কার্ড</button><button data-a="tab" data-v="list" class="${V.tab=='list'?'on':''}">তালিকা</button></div><div class="bar"><i id="pb"></i></div><span id="pt"></span></div><div class="body" id="body"></div>`;body()}
function prog(){const base=V.all,d=base.filter(i=>V.key=='wrong'?S.st[i]==1:S.st[i]).length;const pb=$('#pb');if(pb){pb.style.width=d/base.length*100+'%';$('#pt').textContent=bn(d)+'/'+bn(base.length)}}
const badge=s=>s==1?'<span class="bd sk">✓ জানি</span>':s==2?'<span class="bd sw">✗ ভুল</span>':'';
function cardHTML(){const i=V.order[V.pos],d=D[i],mt=`<div class="meta"><span>প্রশ্ন ${bn(i+1)}</span>${badge(S.st[i])}${d[2]?'<span class="bd fl">⚠ যাচাই করুন</span>':''}</div>`;
 return `<div class="flip${V.flip?' on':''}"><div class="face"><div>${mt}</div><p class="q">${fmt(i)}</p><p class="hint">ট্যাপ করে উত্তর দেখুন</p></div><div class="face b">${mt}<p class="m${d[1].length>45?' lg':''}">${esc(d[1])}</p><p class="q2">${fmt(i)}</p></div></div><button class="star" data-a="star" aria-label="সংরক্ষণ">${S.sv[i]?'★':'☆'}</button>`}
function fill(){const w=$('#cw');if(w)w.innerHTML=cardHTML();const c=$('#cnt');if(c)c.textContent=bn(V.pos+1)+' / '+bn(V.order.length);prog()}
function body(){const b=$('#body');
 if(V.sum)return summary(b);
 if(V.tab=='list')return list(b);
 b.innerHTML=`<div class="stage"><div id="cw" class="cw"></div></div><div class="ctl"><button class="cb" data-a="prev" aria-label="আগের">‹</button><span id="cnt"></span><button class="cb" data-a="next" aria-label="পরের">›</button><button class="cb" data-a="shuf">⇄ মেশান</button></div><div class="acts"><button class="ab r" data-a="again">↺ আবার পড়ব</button><button class="ab g" data-a="know">✓ জানি</button></div>`;fill();swipe()}
function list(b,keep){const y=keep?($('.list')||{}).scrollTop:0;
 b.innerHTML='<div class="list">'+V.all.map(i=>{const o=V.open.has(i),s=S.st[i];return `<div class="li"><div class="lh" data-a="li" data-i="${i}"><span class="no">${bn(i+1)}</span><span class="lq">${fmt(i)}${D[i][2]?' <span class="bd fl">⚠</span>':''}</span><span class="dt ${s==1?'sk':'sw'}">${s==1?'✓':s==2?'✗':''}</span></div>${o?`<div class="lb"><p class="m">${esc(D[i][1])}</p><div class="lbt"><button data-a="lm" data-v="2" data-i="${i}">↺ আবার</button><button data-a="lm" data-v="1" data-i="${i}">✓ জানি</button><button class="star" data-a="ls" data-i="${i}">${S.sv[i]?'★':'☆'}</button></div></div>`:''}</div>`}).join('')+'</div>';
 if(y)$('.list').scrollTop=y;prog()}
function summary(b){const a=V.all,k=a.filter(i=>S.st[i]==1).length,w=a.filter(i=>S.st[i]==2).length,u=a.length-k-w;
 b.innerHTML=`<div class="sm"><h2>${V.title} — সারাংশ</h2><div class="chips"><span class="chip c1">✓ জানি ${bn(k)}</span><span class="chip c2">✗ ভুল ${bn(w)}</span><span class="chip c3">বাকি ${bn(u)}</span></div>
 <button class="sc" data-a="redo"${w?'':' disabled'}>↺ ভুলগুলো আবার পড়ুন (${bn(w)})</button><button class="sc" data-a="rest"${u?'':' disabled'}>বাকিগুলো করুন (${bn(u)})</button><button class="sc" data-a="again0">⟲ আবার শুরু</button><button class="sc" data-a="home">⌂ হোমে ফিরুন</button></div>`;prog()}
function startSub(o){V.order=o;V.pos=0;V.flip=false;V.sum=false;V.tab='card';deck()}
function go(d){const t=V.pos+d,w=$('#cw');if(busy||!w)return;if(t<0||t>=V.order.length)return snap();busy=true;
 w.style.transition='transform .22s ease,opacity .22s';w.style.transform=`translateX(${-d*110}%) rotate(${-d*8}deg)`;w.style.opacity=0;
 setTimeout(()=>{V.pos=t;V.flip=false;fill();w.style.transition='none';w.style.transform=`translateX(${d*60}%)`;void w.offsetWidth;w.style.transition='transform .26s ease,opacity .26s';w.style.transform='';w.style.opacity=1;setTimeout(()=>busy=false,260)},220)}
function snap(){const w=$('#cw');if(!w)return;w.style.transition='transform .2s ease';w.style.transform=''}
function mark(v){if(busy||!V||V.sum||V.tab!='card')return;const i=V.order[V.pos];S.st[i]=v;save();if(V.pos<V.order.length-1)go(1);else{V.sum=true;body()}}
function swipe(){const w=$('#cw');let x0,y0,dx=0,lock=null,dn=false,skip=false,cap=false;
 const st=(x,y,el)=>{if(busy)return;skip=!!el.closest('.star');dn=true;x0=x;y0=y;dx=0;lock=null;w.style.transition='none'};
 const mv=(x,y,ev)=>{if(!dn||skip)return;const mx=x-x0,my=y-y0;if(!lock&&(Math.abs(mx)>6||Math.abs(my)>6))lock=Math.abs(mx)>Math.abs(my)?'x':'y';
  if(lock=='x'){dx=mx;if(ev.cancelable)ev.preventDefault();w.classList.add('drag');w.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`}};
 const en=(ok,ev)=>{if(!dn)return;dn=false;w.classList.remove('drag');if(skip)return;
  if(lock=='x'&&Math.abs(dx)>60){if(ev&&ev.cancelable)ev.preventDefault();go(dx<0?1:-1)}
  else if(!lock&&ok){if(ev&&ev.cancelable)ev.preventDefault();V.flip=!V.flip;w.querySelector('.flip').classList.toggle('on',V.flip)}else snap()};
 w.addEventListener('touchstart',e=>{const t=e.touches[0];st(t.clientX,t.clientY,e.target)},{passive:true});
 w.addEventListener('touchmove',e=>{const t=e.touches[0];mv(t.clientX,t.clientY,e)},{passive:false});
 w.addEventListener('touchend',e=>en(true,e));w.addEventListener('touchcancel',e=>en(false,e));
 w.addEventListener('pointerdown',e=>{if(e.pointerType!='mouse')return;st(e.clientX,e.clientY,e.target);cap=true;try{w.setPointerCapture(e.pointerId)}catch(_){}});
 w.addEventListener('pointermove',e=>{if(e.pointerType=='mouse'&&cap)mv(e.clientX,e.clientY,e)});
 w.addEventListener('pointerup',e=>{if(e.pointerType=='mouse'&&cap){cap=false;en(true,e)}});w.addEventListener('pointercancel',e=>{if(e.pointerType=='mouse'&&cap){cap=false;en(false,e)}})}
function sheet(){let o=$('.ov');if(!o){o=document.createElement('div');o.className='ov';document.body.appendChild(o)}
 const sg=(a,L,cur)=>`<div class="seg">${L.map(([v,l])=>`<button data-a="${a}" data-v="${v}" class="${cur==v?'on':''}">${l}</button>`).join('')}</div>`;
 o.innerHTML=`<div class="sh"><h3>সেটিংস</h3><p>থিম</p>${sg('th',[['auto','অটো'],['light','আলো'],['dark','অন্ধকার']],S.theme)}<p>লেখার আকার</p>${sg('sz',[['s','ছোট'],['m','মাঝারি'],['l','বড়'],['xl','অনেক বড়']],S.size)}<button class="cl" data-a="close">বন্ধ করুন</button></div>`}
document.addEventListener('click',e=>{const ov=e.target.classList.contains('ov');if(ov)return e.target.remove();
 const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,i=+t.dataset.i,v=t.dataset.v;
 switch(a){
 case'gear':sheet();break;case'close':$('.ov')?.remove();break;
 case'th':S.theme=v;save();apply();sheet();break;case'sz':S.size=v;save();apply();sheet();break;
 case'deck':nav=true;location.hash='#/d/'+t.dataset.k;break;
 case'back':nav?(nav=false,history.back()):(location.hash='');break;
 case'home':if(nav){nav=false;history.back()}else location.hash='';break;
 case'reset':if(confirm('সব অগ্রগতি, ভুল ও সংরক্ষিত প্রশ্ন মুছে যাবে। রিসেট করবেন?')){S.st={};S.sv={};save();home()}break;
 case'tab':V.tab=v;V.flip=false;V.sum=false;deck();break;
 case'prev':go(-1);break;
 case'next':if(V.pos>=V.order.length-1){V.sum=true;body()}else go(1);break;
 case'shuf':{if(busy)break;const o=V.order;for(let j=o.length-1;j>0;j--){const r=Math.random()*(j+1)|0;[o[j],o[r]]=[o[r],o[j]]}V.pos=0;V.flip=false;fill();break}
 case'again':mark(2);break;case'know':mark(1);break;
 case'star':{const k=V.order[V.pos];S.sv[k]=!S.sv[k];if(!S.sv[k])delete S.sv[k];save();t.textContent=S.sv[k]?'★':'☆';break}
 case'li':V.open.has(i)?V.open.delete(i):V.open.add(i);list($('#body'),1);break;
 case'lm':S.st[i]=+v;save();list($('#body'),1);break;
 case'ls':S.sv[i]=!S.sv[i];if(!S.sv[i])delete S.sv[i];save();list($('#body'),1);break;
 case'redo':startSub(V.all.filter(j=>S.st[j]==2));break;
 case'rest':startSub(V.all.filter(j=>!S.st[j]));break;
 case'again0':startSub(V.all.slice());break;
 }});
apply();route();
</script>
</body>
</html>
