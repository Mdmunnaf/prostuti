<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3efe8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1d1f" media="(prefers-color-scheme: dark)">
<title>আমার প্রস্তুতি</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe8;--card:#fdfcf8;--ink:#35342f;--mut:#7d7a70;--line:#e8e3d8;--trk:#e6e1d6;--fill:#5b9577;--rd:#b24a3c;--sh:0 2px 10px rgba(70,60,40,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#1c1d1f;--card:#26282b;--ink:#d2d1cb;--mut:#8e8f8a;--line:#34373a;--trk:#35383b;--fill:#5f9a7c;--rd:#e09a8e;--sh:0 2px 12px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri','Noto Sans Bengali',Nikosh,system-ui,sans-serif;line-height:1.65}
main{max-width:34rem;margin:0 auto;padding:calc(1.6rem + env(safe-area-inset-top)) 1.1rem calc(1.6rem + env(safe-area-inset-bottom))}
h1{margin:0;font-size:1.75rem;line-height:1.3;font-weight:700}
.sub{margin:.15rem 0 1.4rem;color:var(--mut);font-size:.95rem}
.list{display:grid;gap:.9rem}
.card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1rem;padding:1rem 1.1rem 1rem 1rem;background:var(--card);border-radius:1.4rem;box-shadow:var(--sh);color:inherit;text-decoration:none;min-height:44px}
.card:active{transform:scale(.98)}
.card:focus-visible{outline:2px solid var(--fill);outline-offset:3px}
.tile{width:3.7rem;height:3.7rem;border-radius:1.1rem;background:var(--t);color:var(--c);display:grid;place-items:center;flex:none}
.tile svg{width:2rem;height:2rem}
.tile .aa{font-size:1.55rem;font-weight:700;letter-spacing:-.02em;line-height:1}
.tile .qq{font-size:3rem;font-weight:700;line-height:1;height:1.5rem;overflow:visible;margin-top:.35rem}
.tx{min-width:0}
h2{margin:0;font-size:1.15rem;line-height:1.4;font-weight:600}
h2 small{display:block;font-size:.9rem;font-weight:500;color:var(--mut);line-height:1.4}
.mm{margin:.1rem 0 0;color:var(--mut);font-size:.9rem}
.bar{height:.5rem;background:var(--trk);border-radius:9px;overflow:hidden;margin:.65rem 0 .35rem}
.bar i{display:block;height:100%;background:var(--fill);border-radius:9px}
.ft{display:flex;justify-content:space-between;gap:.5rem;font-size:.9rem;color:var(--mut)}
.ft u{text-decoration:none;color:var(--rd);font-weight:600}
.go{font-size:1.7rem;line-height:1;color:var(--mut)}
.k-v{--c:#3d7a58;--t:#e3efe5}
.k-i{--c:#3f6f9b;--t:#e6edf5}
.k-b{--c:#b24a3c;--t:#f6e1dc}
.k-w{--c:#a47b0f;--t:#f3e9c9}
@media(prefers-color-scheme:dark){
.k-v{--c:#8fc4a4;--t:#25382d}
.k-i{--c:#8fb4d8;--t:#2a3340}
.k-b{--c:#e09a8e;--t:#3e2a27}
.k-w{--c:#d8b256;--t:#3a3322}}
.note{margin:1.6rem .3rem 0;color:var(--mut);font-size:.85rem;text-align:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <h1>আমার প্রস্তুতি</h1>
  <p class="sub" id="sub"></p>
  <div class="list" id="list"></div>
  <p class="note">অগ্রগতি এই ফোনেই সংরক্ষিত থাকে। ব্রাউজারের ডেটা মুছলে অগ্রগতিও মুছে যাবে।</p>
</main>
<script>
/* নতুন অনুশীলন যোগ করতে এই তালিকায় একটি লাইন বাড়ান। key = ওই পেজের localStorage কী, n = মোট প্রশ্ন */
const TOPICS=[
 {href:'vocab.html',key:'ws1',n:850,cls:'k-v',title:'Word Smart 1<small>Vocabulary Preparation</small>',icon:'<span class="aa">Aa</span>'},
 {href:'international.html',key:'intl1',n:1069,cls:'k-i',title:'আন্তর্জাতিক বিষয় প্রস্তুতি',icon:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="16" cy="16" r="11"/><ellipse cx="16" cy="16" rx="4.6" ry="11"/><path d="M5 16h22M7 10h18M7 22h18"/></svg>'},
 {href:'bangladesh.html',key:'natl1',n:577,cls:'k-b',title:'বাংলাদেশ বিষয় প্রস্তুতি',icon:'<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3.5" y="7.5" width="25" height="17" rx="2.6" fill="#1f7a5c"/><circle cx="14.2" cy="16" r="4.8" fill="#d9423b"/></svg>'},
 {href:'idioms.html',key:'bagdhara1',n:408,cls:'k-w',title:'বাগধারা প্রস্তুতি',icon:'<span class="qq" aria-hidden="true">“</span>'}
];
const PER=50;
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
function stat(t){let m=0,w=0;try{const x=JSON.parse(localStorage.getItem(t.key)||'{}'),s=(x&&x.st)||{};for(let i=0;i<t.n;i++){if(s[i]==1||s[i]==2){m++;if(s[i]==2)w++}}}catch(e){}return{m,w}}
function render(){
  let total=0;
  document.getElementById('list').innerHTML=TOPICS.map(t=>{
    total+=t.n;const s=stat(t),sets=Math.ceil(t.n/PER),p=Math.round(s.m/t.n*100);
    return `<a class="card ${t.cls}" href="${t.href}"><div class="tile">${t.icon}</div><div class="tx"><h2>${t.title}</h2><p class="mm">${bn(t.n)}টি প্রশ্ন · ${bn(sets)}টি সেট</p><div class="bar"><i style="width:${p}%"></i></div><div class="ft"><span>${s.m?bn(s.m)+' / '+bn(t.n)+' অনুশীলিত':'শুরু হয়নি'}</span>${s.w?`<u>✗ ${bn(s.w)}</u>`:''}</div></div><span class="go" aria-hidden="true">›</span></a>`
  }).join('');
  document.getElementById('sub').textContent=bn(TOPICS.length)+'টি অনুশীলন · '+bn(total)+'টি প্রশ্ন';
}
render();
addEventListener('pageshow',render);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
